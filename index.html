<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite de Aniversário</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("convite.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .convite {
            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 25px;

            padding: 35px 25px;

            text-align: center;

            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 17px;
            color: #555;
            margin-bottom: 30px;
        }

        .informacoes {
            background: #f5f5f5;
            border-radius: 18px;

            padding: 20px;

            margin-bottom: 25px;
        }

        .informacoes p {
            margin: 12px 0;
            font-size: 17px;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .botao {
            display: block;

            padding: 17px;

            border-radius: 14px;

            text-decoration: none;

            font-weight: bold;
            font-size: 17px;

            transition: 0.2s;
        }

        .botao:hover {
            transform: scale(1.03);
        }

        .confirmar {
            background: #25D366;
            color: white;
        }

        .localizacao {
            background: #4285F4;
            color: white;
        }

        .nao-vou {
            background: #eeeeee;
            color: #444;
        }

        .rodape {
            margin-top: 25px;

            font-size: 13px;
            color: #777;
        }

    </style>
</head>

<body>

    <div class="convite">

        <div class="emoji">🎉</div>

        <h1>Você está convidado!</h1>

        <p class="subtitulo">
            Será muito especial ter você conosco neste dia.
        </p>


        <div class="informacoes">

            <p>
                📅 <strong>17 de outubro de 2026</strong>
            </p>

            <p>
                🕔 <strong>17:00h</strong>
            </p>

            <p>
                📍 <strong>Residencial Imperial</strong>
            </p>

        </div>


        <div class="botoes">

            <!-- CONFIRMAR PRESENÇA -->

            <a
                class="botao confirmar"
                href="https://wa.me/5594992094603?text=Olá!%20Confirmo%20minha%20presença%20no%20aniversário.%20🎉"
                target="_blank"
            >
                ✅ Confirmar presença
            </a>


            <!-- LOCALIZAÇÃO -->

            <a
                class="botao localizacao"
                href="https://www.google.com/maps/search/?api=1&query=Residencial+Imperial"
                target="_blank"
            >
                📍 Ver localização
            </a>


            <!-- NÃO PODEREI COMPARECER -->

            <a
                class="botao nao-vou"
                href="https://wa.me/5594992094603?text=Olá!%20Infelizmente%20não%20poderei%20comparecer%20ao%20aniversário."
                target="_blank"
            >
                ❌ Não poderei comparecer
            </a>

        </div>


        <p class="rodape">
            Toque em uma das opções acima.
        </p>

    </div>

</body>
</html>
