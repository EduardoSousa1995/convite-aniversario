<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Convite de Aniversário - Aylla 5 anos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #6b21a8, #ec4899);
      min-height: 100vh;
      padding: 20px 12px 40px;
    }

    .pagina {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    /* CONVITE COMPLETO */
    .convite-img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
    }

    /* ÁREA DOS BOTÕES */
    .acoes {
      margin-top: 18px;
      padding: 20px;
      background: rgba(255,255,255,0.96);
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .acoes h2 {
      margin: 0 0 8px;
      color: #5b167d;
      font-size: 24px;
    }

    .acoes p {
      margin: 0 0 18px;
      color: #555;
      font-size: 15px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 17px 15px;
      margin: 12px 0;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .botao:active {
      transform: scale(0.98);
    }

    .confirmar {
      background: #22c55e;
      color: white;
    }

    .localizacao {
      background: #7c3aed;
      color: white;
    }

    .nao {
      background: #ef4444;
      color: white;
    }

    .rodape {
      margin-top: 16px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="pagina">

    <!-- IMAGEM ORIGINAL DO CONVITE -->
    <img
      src="convite.jpg"
      alt="Convite de aniversário da Aylla - 5 anos"
      class="convite-img"
    >

    <!-- BOTÕES INTERATIVOS -->
    <section class="acoes">

      <h2>Você vem comemorar comigo? 🎉</h2>

      <p>
        Confirme sua presença e venha celebrar os 5 anos da Aylla!
      </p>

      <a
        class="botao confirmar"
        href="https://wa.me/5594992094603?text=Olá!%20Confirmo%20minha%20presença%20no%20aniversário%20da%20Aylla.%20🎉"
        target="_blank"
      >
        ✅ Confirmar presença
      </a>

      <a
        class="botao localizacao"
        href="https://www.google.com/maps/search/?api=1&query=-6.53771,-49.86727"
        target="_blank"
      >
        📍 Ver localização
      </a>

      <a
        class="botao nao"
        href="https://wa.me/5594992094603?text=Olá!%20Agradeço%20muito%20o%20convite,%20mas%20não%20poderei%20comparecer%20ao%20aniversário%20da%20Aylla."
        target="_blank"
      >
        ❌ Não poderei comparecer
      </a>

      <div class="rodape">
        📅 17/10/2026 • ⏰ 17:00h • 📍 Residencial Imperial
      </div>

    </section>

  </main>

</body>
</html>
